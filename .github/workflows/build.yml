name: Build ImmortalWRT for SEED AC5

on:
  workflow_dispatch:    # 手动触发
  push:
    branches: [master]
    paths:
      - '.config'
      - 'feeds.conf.default'
      - '.github/workflows/build.yml'
      - 'files/**'

  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点检查上游更新(北京时间 8:00)

permissions:
  contents: write

env:
  REPO_URL: https://github.com/BeeconMini/immortalwrt.git
  REPO_BRANCH: 25.12.0-rc2
  TARGET: mediatek/filogic
  DEVICE: beeconmini_seed-ac5
  # ccache(编译缓存): 显著缩短二次编译时间(官方 CI 与社区模板均采用)
  CCACHE_DIR: ${{ github.workspace }}/source/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    # 2026-09-10: 回到 x86(ubuntu-22.04) 平台, 通过"多层缓存(dl/ccache/staging)+启用 CONFIG_CCACHE
    # +移除触发 Rust 工具链的孤儿包"解决原先冷构建超时问题, 不再使用 ARM runner。
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq build-essential ccache clang cmake curl \
            ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-docutils python3-setuptools rsync swig time \
            unzip wget zlib1g-dev qemu-utils
          echo "runner arch: $(uname -m), nproc: $(nproc), mem: $(free -h | awk '/Mem/{print $2}')"
          ccache --version | head -1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          df -h /

      - name: Clone source
        run: |
          git clone -b $REPO_BRANCH --single-branch $REPO_URL source
          cd source
          cp $GITHUB_WORKSPACE/feeds.conf.default feeds.conf.default
          cp $GITHUB_WORKSPACE/.config .config
          [ -d $GITHUB_WORKSPACE/files ] && cp -r $GITHUB_WORKSPACE/files ./
          mkdir -p .ccache
          echo "=== 下载目录/缓存 ==="
          df -h .

      # ---- 多层缓存(社区验证做法: linkease/openwrt-app-actions、OpenWrt Fastbuild、openwrt 官方 CI) ----
      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: source/dl
          key: dl-${{ hashFiles('feeds.conf.default') }}-${{ github.run_number }}
          restore-keys: |
            dl-${{ hashFiles('feeds.conf.default') }}-
            dl-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: source/.ccache
          key: ccache-${{ hashFiles('.config', 'feeds.conf.default') }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ hashFiles('.config', 'feeds.conf.default') }}-
            ccache-

      - name: Restore staging_dir
        uses: actions/cache@v4
        with:
          path: source/staging_dir
          key: staging-${{ hashFiles('.config', 'feeds.conf.default') }}-${{ github.run_number }}
          restore-keys: |
            staging-${{ hashFiles('.config', 'feeds.conf.default') }}-
            staging-

      - name: Update feeds & apply fixes
        run: |
          cd source
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 修复 libffi feed: 上游 InstallDev 复制 fficonfig.h 的 $(GNU_TARGET_NAME)* glob
          # 在 3.4.7 布局下匹配不到(历史编译失败原因之一)。直接改 feed 的 Makefile, 用 find 兜底。
          # 注意: 不可做成 feeds/.../libffi/patches/*.patch(会把补丁打进 libffi 源码树导致失败)
          python3 $GITHUB_WORKSPACE/scripts/fix-libffi-makefile.py feeds/packages/libs/libffi/Makefile
          # 启用 ccache
          if grep -qE '^CONFIG_CCACHE=' .config; then
            sed -i 's|^CONFIG_CCACHE=.*|CONFIG_CCACHE=y|' .config
          else
            echo 'CONFIG_CCACHE=y' >> .config
          fi
          # 配置收敛: 历史 .config 单次 defconfig 会静默丢弃大部分已选包(固件缩水到28MB),
          # 反复"从原始 .config 补回缺失的 =y 并 defconfig"直至稳定, 得到规范化配置。
          PREV=-1
          for i in 1 2 3 4 5 6 7 8; do
            grep -hE '^CONFIG_PACKAGE_[^ =]+=y' $GITHUB_WORKSPACE/.config | while IFS= read -r line; do
              sym="${line%%=*}"
              if ! grep -qE "^${sym}=y$|^${sym}=m$" .config; then
                echo "$line" >> .config
              fi
            done
            make defconfig >/dev/null 2>&1
            N=$(grep -cE '^CONFIG_PACKAGE_[a-z0-9._-]+=y' .config || true)
            echo "第 $i 轮后 PACKAGE=y: $N"
            if [ "$N" -eq "$PREV" ]; then echo "配置已收敛"; break; fi
            PREV=$N
          done
          # defconfig 后再次确保 ccache 开启(防止被冲掉)
          grep -qE '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          grep -E '^CONFIG_CCACHE=' .config

      - name: Validate config (防配置丢失回归)
        run: |
          cd source
          PKGS=$(grep -cE '^CONFIG_PACKAGE_[a-z0-9._-]+=y' .config || true)
          LUCI=$(grep -cE '^CONFIG_PACKAGE_luci-app-[a-z0-9-]+=y' .config || true)
          echo "收敛后有效包数: $PKGS, luci-app 数: $LUCI"
          if [ "$PKGS" -lt 430 ]; then
            echo "::error::defconfig 后包数异常($PKGS < 430), 疑似配置被静默丢弃, 终止构建"
            exit 1
          fi
          if [ "$LUCI" -lt 20 ]; then
            echo "::error::defconfig 后 luci-app 数异常($LUCI < 20), 终止构建"
            exit 1
          fi
          for p in luci-app-dockerman luci-app-mwan3 nikki mwan3 dockerd; do
            if ! grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "::error::关键包 $p 未保留!"
              exit 1
            fi
          done
          # 防回归: 确认会触发 Rust 工具链的孤儿包确实已关闭
          for p in shadowsocks-rust-sslocal shadowsocks-rust-ssserver shadow-tls dns2socks-rust; do
            if grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "::error::$p 仍被选中, 会编译 Rust 工具链(1.5~2h)导致超时"
              exit 1
            fi
          done
          echo "关键包全部保留 ✓"

      - name: Download source packages
        run: |
          cd source
          for i in 1 2 3; do
            echo "--- make download 第 $i 次 ---"
            if make -j$(($(nproc)+1)) download; then
              echo "源码包全部下载成功"
              break
            fi
            echo "download 存在失败项, 30秒后重试..."
            sleep 30
          done
          make download 2>&1 | grep -iE "failed|error" && exit 1 || true
        timeout-minutes: 60

      - name: Build firmware
        run: |
          cd source
          make -j$(nproc) V=s
          echo "=== ccache 统计 ==="
          ccache -s || true
        timeout-minutes: 345

      - name: Rename firmware (型号-版本命名)
        run: |
          cd source/bin/targets/mediatek/filogic
          for f in immortalwrt-*-beeconmini_seed-ac5-*.bin; do
            [ -e "$f" ] || continue
            new=$(echo "$f" | sed -E "s/^immortalwrt-mediatek-filogic-beeconmini_seed-ac5/SEED-AC5-${REPO_BRANCH}/")
            mv -v "$f" "$new"
          done
          echo "=== 重命名后产物 ==="
          ls -la *.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: seed-ac5-firmware
          path: |
            source/bin/targets/mediatek/filogic/*.bin
            source/bin/targets/mediatek/filogic/*.buildinfo
            source/bin/targets/mediatek/filogic/*.manifest
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Firmware build ${{ github.run_id }}
          body: |
            Automated build triggered by ${{ github.event_name }}.
            - Commit: ${{ github.sha }}
            - Date: ${{ github.event.head_commit.timestamp || github.event.client_payload.created_at || 'manual' }}
          files: |
            source/bin/targets/mediatek/filogic/*.bin
            source/bin/targets/mediatek/filogic/*.buildinfo
          generate_release_notes: true
          make_latest: true
