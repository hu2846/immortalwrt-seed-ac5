name: Debug Config

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq build-essential ccache clang cmake curl \
            ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-docutils python3-setuptools rsync swig time \
            unzip wget zlib1g-dev qemu-utils

      - name: Clone source
        run: |
          git clone -b 25.12.0-rc2 --single-branch https://github.com/BeeconMini/immortalwrt.git source
          cd source
          cp $GITHUB_WORKSPACE/feeds.conf.default feeds.conf.default
          cp $GITHUB_WORKSPACE/.config .config

      - name: Before defconfig
        run: |
          cd source
          echo "=== defconfig 前 ==="
          echo "总行数: $(wc -l < .config)"
          echo "PACKAGE 启用数: $(grep -cE '^CONFIG_PACKAGE_[a-z0-9._-]+=y' .config)"
          echo "luci-app 启用数: $(grep -cE '^CONFIG_PACKAGE_luci-app-[a-z0-9-]+=y' .config)"
          echo "kmod 启用数: $(grep -cE '^CONFIG_PACKAGE_kmod-[a-z0-9._-]+=y' .config)"

      - name: Update feeds
        run: |
          cd source
          ./scripts/feeds update -a 2>&1 | tail -30
          echo "=== feeds 目录 ==="
          ls feeds/
          echo "=== feeds install ==="
          ./scripts/feeds install -a 2>&1 | tail -20

      - name: Remove broken packages from small feed (disabled for this forensics run)
        run: |
          cd source
          echo "(removal step disabled)"

      - name: Run defconfig
        run: |
          cd source
          make defconfig 2>&1 | tee /tmp/defconfig.log | tail -30

      - name: Retry force-select test (关键实验)
        run: |
          cd source
          echo "=== 第一次 defconfig 后关键包 ==="
          for p in luci-app-dockerman luci-app-mwan3 luci-app-nikki nikki mwan3 dockerd luci-app-firewall; do
            echo "  $p : $(grep -cE "^CONFIG_PACKAGE_$p=y" .config)"
          done
          echo "=== 强制重新勾选并再次 defconfig ==="
          for p in luci-app-dockerman luci-app-mwan3 luci-app-nikki nikki mwan3 dockerd; do
            grep -qE "^CONFIG_PACKAGE_$p=y" .config || echo "CONFIG_PACKAGE_$p=y" >> .config
          done
          # 去掉可能被写入的 is-not-set 反选
          sed -i '/# CONFIG_PACKAGE_luci-app-dockerman is not set/d;/# CONFIG_PACKAGE_luci-app-mwan3 is not set/d;/# CONFIG_PACKAGE_luci-app-nikki is not set/d;/# CONFIG_PACKAGE_nikki is not set/d;/# CONFIG_PACKAGE_mwan3 is not set/d;/# CONFIG_PACKAGE_dockerd is not set/d' .config
          make defconfig 2>&1 | tee /tmp/defconfig2.log | tail -15
          echo "=== 第二次 defconfig 后关键包 ==="
          for p in luci-app-dockerman luci-app-mwan3 luci-app-nikki nikki mwan3 dockerd luci-app-firewall; do
            echo "  $p : $(grep -cE "^CONFIG_PACKAGE_$p=y" .config)"
          done
          echo "luci-app 总数(第2次后): $(grep -cE '^CONFIG_PACKAGE_luci-app-[a-z0-9-]+=y' .config)"
          echo "递归错误数(第2次): $(grep -c 'recursive dependency detected' /tmp/defconfig2.log)"

      - name: Config forensics
        run: |
          cd source
          echo "=== 取证 ==="
          echo "config-package.in 总行数: $(wc -l < tmp/.config-package.in 2>/dev/null)"
          echo "package.in 中 config PACKAGE_ 总数: $(grep -c '^config PACKAGE_' tmp/.config-package.in 2>/dev/null)"
          echo "package.in 中 luci-app 总数: $(grep -cE '^config PACKAGE_luci-app-' tmp/.config-package.in 2>/dev/null)"
          for p in luci-app-dockerman nikki luci-app-homeproxy luci-app-firewall luci-app-package-manager luci-app-mwan3 mwan3 dockerd; do
            echo "package.in 含 $p : $(grep -cE "config PACKAGE_${p}$|config PACKAGE_${p}\b" tmp/.config-package.in 2>/dev/null)"
          done
          echo "package/feeds 目录: $(ls package/feeds 2>/dev/null | wc -l) 项"
          ls package/feeds 2>/dev/null | head -20
          echo ".config 中 dockerman 行: $(grep -cE '^CONFIG_PACKAGE_luci-app-dockerman' .config)"
          echo "make 版本: $(make --version | head -1)"

      - name: Find recursive dependency packages
        run: |
          cd source
          echo "=== 递归依赖对应的包 ==="
          grep -oP 'config-package\.in:\K[0-9]+' /tmp/defconfig.log | sort -u | while read ln; do
            pkg=$(awk -v t="$ln" 'NR<=t && /^config PACKAGE_/ {n=$2} NR==t {print n; exit}' tmp/.config-package.in)
            echo "  行 $ln -> ${pkg:-未知}"
          done
          echo ""
          echo "=== 这些包当前是否启用 ==="
          grep -oP 'config-package\.in:\K[0-9]+' /tmp/defconfig.log | sort -u | while read ln; do
            pkg=$(awk -v t="$ln" 'NR<=t && /^config PACKAGE_/ {n=$2} NR==t {print n; exit}' tmp/.config-package.in)
            [ -n "$pkg" ] && grep -E "^${pkg}=" .config || true
          done

      - name: After defconfig
        run: |
          cd source
          echo "=== defconfig 后 ==="
          echo "总行数: $(wc -l < .config)"
          echo "PACKAGE 启用数: $(grep -cE '^CONFIG_PACKAGE_[a-z0-9._-]+=y' .config)"
          echo "luci-app 启用数: $(grep -cE '^CONFIG_PACKAGE_luci-app-[a-z0-9-]+=y' .config)"
          echo "kmod 启用数: $(grep -cE '^CONFIG_PACKAGE_kmod-[a-z0-9._-]+=y' .config)"
          echo ""
          echo "=== 关键包核对 ==="
          for p in luci-app-dockerman luci-app-homeproxy luci-app-nikki nikki dockerd mwan3 luci-app-mwan3; do
            if grep -qE "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  [保留] $p"
            else
              echo "  [丢失] $p"
            fi
          done
          echo ""
          echo "=== 保留的 luci-app 列表 ==="
          grep -E '^CONFIG_PACKAGE_luci-app-[a-z0-9-]+=y' .config | sed 's/^CONFIG_PACKAGE_//;s/=y$//' || echo "  (无)"

      - name: Check feeds availability
        run: |
          cd source
          echo "=== 检查关键包在 feeds 中是否存在 ==="
          for p in luci-app-dockerman luci-app-homeproxy luci-app-nikki nikki; do
            found=$(find feeds -maxdepth 3 -type d -name "$p" 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              echo "  [存在] $p -> $found"
            else
              echo "  [不存在] $p"
            fi
          done
