name: Probe ARM runner

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Show arch and cores
        run: |
          uname -a
          echo "nproc: $(nproc)"
          echo "mem: $(free -h | head -2)"
          echo "disk: $(df -h / | tail -1)"
